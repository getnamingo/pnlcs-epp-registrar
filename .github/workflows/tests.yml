name: Module tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xml, simplexml, xmlwriter, mbstring
          tools: composer:v2
      - name: Install module dependencies
        working-directory: EPP/namingo
        run: |
          composer validate --strict
          composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Check PHP and run regression tests
        run: |
          php -l EPP/EppRegistrar.php
          php tests/run.php
          php tests/tembo-xml.php
          php tests/local-dependencies.php
      - name: Check release layout and bundled autoloader
        run: |
          scripts/build-release.sh test
          mkdir dist/unpacked
          unzip -q dist/pnlcs-epp-test.zip -d dist/unpacked
          php -r 'require "dist/unpacked/modules/Registrars/EPP/namingo/vendor/autoload.php"; Pinga\Tembo\EppRegistryFactory::create("generic");'
